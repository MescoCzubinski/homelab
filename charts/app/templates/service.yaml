{{- range fromYamlArray (include "app.workloads" .) }}
{{- if .port }}
{{- $args := dict "root" $ "workload" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "app.labels" $args | nindent 4 }}
spec:
  selector:
    {{- include "app.selectorLabels" $args | nindent 4 }}
  ports:
    - name: http
      port: {{ .port }}
      targetPort: http
{{- end }}
{{- end }}
