{{- range fromYamlArray (include "app.workloads" .) }}
{{- $args := dict "root" $ "workload" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "app.labels" $args | nindent 4 }}
  {{- if $.Values.jobs }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  {{- end }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  {{- if .duckdb }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" $args | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" $args | nindent 8 }}
    spec:
      {{- include "app.podSpec" $args | nindent 6 }}
{{- end }}
