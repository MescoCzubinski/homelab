apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-atlas
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-postgres
  claimRef:
    namespace: atlas
    name: atlas-pg-1
  local:
    path: /home/server/postgres/atlas
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - myserver.home
