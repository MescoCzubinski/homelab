apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: homepage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  commonUpdateSettings:
    updateStrategy: semver
    allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+$"
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: homepage
      images:
        - alias: homepage
          imageName: ghcr.io/mescoczubinski/homepage
          manifestTargets:
            helm:
              name: "components[0].image.repository"
              tag: "components[0].image.tag"
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: meetly
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  commonUpdateSettings:
    updateStrategy: semver
    allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+$"
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: meetly
      images:
        - alias: backend
          imageName: ghcr.io/mescoczubinski/meetly-backend
          manifestTargets:
            helm:
              name: "components[0].image.repository"
              tag: "components[0].image.tag"
        - alias: frontend
          imageName: ghcr.io/mescoczubinski/meetly-frontend
          manifestTargets:
            helm:
              name: "components[1].image.repository"
              tag: "components[1].image.tag"
