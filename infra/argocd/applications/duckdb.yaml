apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duckdb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:MescoCzubinski/homelab.git
    targetRevision: main
    path: infra/duckdb
  destination:
    server: https://kubernetes.default.svc
    namespace: duckdb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: baseline
        pod-security.kubernetes.io/audit: baseline
