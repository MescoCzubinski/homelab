apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stirling
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://docs.stirlingpdf.com/Stirling-PDF-chart/
      chart: stirling-pdf-chart
      targetRevision: 3.2.0
      helm:
        releaseName: stirling
        valueFiles:
          - $values/tools/stirling/values.yaml
    - repoURL: git@github.com:MescoCzubinski/homelab.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:MescoCzubinski/homelab.git
      targetRevision: main
      path: tools/stirling
      directory:
        include: "networkpolicy.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: stirling
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
