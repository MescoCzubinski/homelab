image:
  tag: v5.37.0

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-http-vpn-only@kubernetescrd
  hosts:
    - gatus.czubinski.dev

deployment:
  strategy: Recreate

env:
  DISCORD_WEBHOOK_URL:
    valueFrom:
      secretKeyRef:
        name: gatus-discord
        key: webhook-url

extraVolumeMounts:
  - name: data
    mountPath: /data
    hostPath: /home/server/gatus/data

config:
  storage:
    type: sqlite
    path: /data/data.db
  alerting:
    discord:
      webhook-url: "${DISCORD_WEBHOOK_URL}"
      default-alert:
        failure-threshold: 2
        send-on-resolved: true
  endpoints:
    - name: Homepage
      group: apps
      url: "https://czubinski.dev/"
      interval: 5m
      conditions:
        - "[STATUS] == 200"
      alerts:
        - type: discord
    - name: Meetly frontend
      group: apps
      url: "https://meetly.czubinski.dev/"
      interval: 5m
      conditions:
        - "[STATUS] == 200"
      alerts:
        - type: discord
    - name: Meetly backend
      group: apps
      url: "https://meetly.czubinski.dev/api/health"
      interval: 5m
      conditions:
        - "[STATUS] == 200"
      alerts:
        - type: discord
    - name: Atlas frontend
      group: apps
      url: "https://atlas.czubinski.dev/"
      interval: 5m
      conditions:
        - "[STATUS] == 200"
      alerts:
        - type: discord
    - name: Atlas backend
      group: apps
      url: "https://atlas.czubinski.dev/api/health"
      interval: 5m
      conditions:
        - "[STATUS] == 200"
      alerts:
        - type: discord
    - name: Traefik
      group: infra
      url: "tcp://traefik.traefik.svc.cluster.local:443"
      interval: 5m
      conditions:
        - "[CONNECTED] == true"
      alerts:
        - type: discord
    - name: ArgoCD
      group: tools
      url: "http://argocd-server.argocd.svc.cluster.local/healthz"
      interval: 5m
      conditions:
        - "[STATUS] == 200"
      alerts:
        - type: discord
    - name: Beszel
      group: tools
      url: "http://beszel-hub.beszel.svc.cluster.local:8090/"
      interval: 5m
      conditions:
        - "[STATUS] == 200"
      alerts:
        - type: discord
    - name: ConvertX
      group: tools
      url: "http://convertx.convertx.svc.cluster.local:3000/"
      interval: 5m
      conditions:
        - "[STATUS] == 200"
      alerts:
        - type: discord
    - name: Stirling PDF
      group: tools
      url: "http://stirling.stirling.svc.cluster.local:8080/"
      interval: 5m
      conditions:
        - "[STATUS] == 200"
      alerts:
        - type: discord
    - name: Syncthing
      group: tools
      url: "tcp://syncthing.syncthing.svc.cluster.local:8384"
      interval: 5m
      conditions:
        - "[CONNECTED] == true"
      alerts:
        - type: discord
    - name: Samba
      group: tools
      url: "tcp://samba.samba.svc.cluster.local:445"
      interval: 5m
      conditions:
        - "[CONNECTED] == true"
      alerts:
        - type: discord
    - name: Syncthing sync
      group: tools
      url: "tcp://syncthing.syncthing.svc.cluster.local:22000"
      interval: 5m
      conditions:
        - "[CONNECTED] == true"
      alerts:
        - type: discord
