apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-memory
  namespace: basic-memory
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: basic-memory
  template:
    metadata:
      labels:
        app: basic-memory
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: basic-memory
          image: ghcr.io/basicmachines-co/basic-memory:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - basic-memory
            - mcp
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: TZ
              value: Europe/Warsaw
            - name: FASTMCP_CHECK_FOR_UPDATES
              value: "off"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /home/appuser/.basic-memory
            - name: data
              mountPath: /app/data
            - name: cache
              mountPath: /home/appuser/.cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          hostPath:
            path: /home/server/basic-memory/config
            type: Directory
        - name: data
          hostPath:
            path: /home/server/basic-memory/data
            type: Directory
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
