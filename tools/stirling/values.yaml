fullnameOverride: stirling

image:
  registry: docker.io
  repository: stirlingtools/stirling-pdf
  tag: 3.0.2

strategy:
  type: Recreate

envs:
  - name: SECURITY_ENABLELOGIN
    value: "false"
  - name: SYSTEM_ENABLEANALYTICS
    value: "false"
  - name: SYSTEM_MAXFILESIZE
    value: "200"
  - name: SYSTEM_DEFAULTLOCALE
    value: en-GB
  - name: JAVA_CUSTOM_OPTS
    value: "-Xmx2g -XX:InitialRAMPercentage=0.5 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

deployment:
  arbitraryUid: true
  extraVolumes:
    - name: tmp
      emptyDir: {}
    - name: config
      hostPath:
        path: /home/server/stirling/config
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: config
      mountPath: /configs

ingress:
  enabled: true
  ingressClassName: traefik
  pathType: Prefix
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-http-vpn-only@kubernetescrd
  hosts:
    - name: stirling.czubinski.dev
      path: /
