apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: samba-smb
  namespace: samba
spec:
  entryPoints:
    - samba-tcp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: samba
          port: 445
      middlewares:
        - name: tcp-vpn-only
          namespace: default
