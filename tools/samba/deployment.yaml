apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: samba
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: samba
          image: ghcr.io/servercontainers/samba:smbd-only-latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
                - KILL
                - SYS_CHROOT
          env:
            - name: TZ
              value: Europe/Warsaw
            - name: ACCOUNT_admin
              valueFrom:
                secretKeyRef:
                  name: samba-password
                  key: password
            - name: SAMBA_VOLUME_CONFIG_shared
              value: "[Shared]; path=/shares/Shared; valid users = admin; guest ok = no; read only = no; browseable = yes"
          ports:
            - containerPort: 445
          volumeMounts:
            - name: shared
              mountPath: /shares/Shared
      volumes:
        - name: shared
          hostPath:
            path: /home/server/samba/Shared
            type: DirectoryOrCreate
