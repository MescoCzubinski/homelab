apiVersion: apps/v1
kind: Deployment
metadata:
  name: convertx
  namespace: convertx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: convertx
  template:
    metadata:
      labels:
        app: convertx
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: convertx
          image: ghcr.io/c4illin/convertx:v0.19.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: Europe/Warsaw
            - name: ALLOW_UNAUTHENTICATED
              value: "true"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          hostPath:
            path: /home/server/convertx/data
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
