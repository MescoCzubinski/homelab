apiVersion: v1
kind: Pod
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  hostNetwork: true
  containers:
    - name: kube-vip
      image: ghcr.io/kube-vip/kube-vip:v1.3.1
      args:
        - manager
      env:
        - name: address
          value: "192.168.1.101"
        - name: vip_subnet
          value: "32"
        - name: port
          value: "6443"
        - name: vip_interface
          value: enp1s0f0
        - name: vip_arp
          value: "true"
        - name: cp_enable
          value: "true"
        - name: cp_namespace
          value: kube-system
        - name: svc_enable
          value: "false"
        - name: lb_enable
          value: "false"
        - name: vip_leaderelection
          value: "true"
        - name: vip_leasename
          value: plndr-cp-lock
        - name: vip_nodename
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: prometheus_server
          value: ""
        - name: k8s_config_file
          value: /etc/kube-vip/admin.conf
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
          add:
            - NET_ADMIN
            - NET_RAW
      volumeMounts:
        - name: kubeconfig
          mountPath: /etc/kube-vip/admin.conf
          readOnly: true
  volumes:
    - name: kubeconfig
      hostPath:
        path: /var/lib/k0s/pki/admin.conf
        type: File
