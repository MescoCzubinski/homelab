apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beszel-hub
  template:
    metadata:
      labels:
        app: beszel-hub
    spec:
      containers:
        - name: beszel-hub
          image: henrygd/beszel:latest
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: data
              mountPath: /beszel_data
      volumes:
        - name: data
          hostPath:
            path: /home/server/beszel/hub-data
            type: DirectoryOrCreate
