apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: syncthing-sync
  namespace: syncthing
spec:
  entryPoints:
    - syncthing-tcp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: syncthing
          port: 22000
      middlewares:
        - name: tcp-vpn-only
          namespace: default
