apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syncthing
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-vpn-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: syncthing.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: syncthing-gui
                port:
                  number: 8384
