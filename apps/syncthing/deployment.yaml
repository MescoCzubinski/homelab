apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: syncthing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      initContainers:
        - name: syncthing-gui-auth
          image: syncthing/syncthing:latest
          command:
            - sh
            - -c
            - cp /config-template/config.xml /var/syncthing/config/config.xml && printf '%s' "$SYNCTHING_PASSWORD" | syncthing generate --config=/var/syncthing/config --data=/var/syncthing/data --gui-user="$SYNCTHING_USER" --gui-password=-
          env:
            - name: STHOMEDIR
              value: ""
            - name: SYNCTHING_USER
              valueFrom:
                secretKeyRef:
                  name: syncthing-password
                  key: username
            - name: SYNCTHING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: syncthing-password
                  key: password
          volumeMounts:
            - name: config
              mountPath: /var/syncthing/config
            - name: data
              mountPath: /var/syncthing/data
            - name: config-template
              mountPath: /config-template/config.xml
              subPath: config.xml
              readOnly: true
      containers:
        - name: syncthing
          image: syncthing/syncthing:latest
          ports:
            - containerPort: 8384
            - containerPort: 22000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /var/syncthing/config
            - name: data
              mountPath: /var/syncthing/data
      volumes:
        - name: config
          hostPath:
            path: /home/server/syncthing/config
        - name: data
          hostPath:
            path: /home/server/syncthing/data
        - name: config-template
          configMap:
            name: syncthing-config
