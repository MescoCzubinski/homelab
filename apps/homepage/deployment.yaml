apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: homepage
          image: ghcr.io/mescoczubinski/homepage:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
