host: czubinski.dev
access: public

components:
  - name: homepage
    image:
      repository: ghcr.io/mescoczubinski/homepage
      tag: v0.0.1
    port: 80
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
          - CHOWN
          - SETUID
          - SETGID
    paths:
      - /
    probe:
      path: /
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 64Mi
