name: trivy

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      KUBERNETES_VERSION: 1.36.2
      TRIVY_VERSION: v0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Trivy
        run: |
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" -o trivy.tar.gz
          echo "$TRIVY_SHA256  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/
      - name: Render upstream charts of all Applications
        run: |
          yq -r -N '
            .spec.destination.namespace as $ns
            | .spec.sources[]?
            | select(.chart and .repoURL != "ghcr.io/mescoczubinski/charts")
            | [.helm.releaseName, .chart, .repoURL, .targetRevision, $ns, (.helm.valueFiles[0] // "")]
            | @tsv
          ' infra/argocd/applications/*.yaml | grep . | while read -r release chart repo version ns values; do
            values=${values#\$values/}
            helm template "$release" "$chart" --repo "$repo" --version "$version" -n "$ns" --kube-version "$KUBERNETES_VERSION" ${values:+-f "$values"}
          done > rendered.yaml
      - name: Scan upstream images
        run: |
          yq -r -N '.. | select(tag == "!!map" and has("image")) | .image | select(tag == "!!str")' rendered.yaml $(git ls-files 'tools/*.yaml' 'infra/*.yaml' | grep -v values.yaml) | sort -u > images.txt
          [ -s images.txt ]
          : > findings.jsonl
          : > failed.txt
          while read -r image; do
            if trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --timeout 20m --no-progress --format json --output report.json "$image"; then
              jq -c '.ArtifactName as $image | .Results[]?.Vulnerabilities[]? | {$image, pkg: .PkgName, id: .VulnerabilityID, url: .PrimaryURL, installed: .InstalledVersion, fixed: .FixedVersion}' report.json >> findings.jsonl
            else
              echo "$image" >> failed.txt
            fi
          done < images.txt
      - name: Update the dashboard issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "CRITICAL CVEs with a fix in the upstream images of \`tools/\`, \`infra/\` and their charts. Rewritten daily by [Trivy]($RUN_URL), closed when the list is empty."
            if [ -s findings.jsonl ]; then
              echo
              echo "| Image | Package | CVE | Installed | Fixed |"
              echo "| --- | --- | --- | --- | --- |"
              jq -rs 'unique | sort_by(.image, .pkg, .id) | .[]
                | "| `\(.image)` | \(.pkg) | \(if .url then "[\(.id)](\(.url))" else .id end) | \(.installed) | \(.fixed) |"' findings.jsonl
            fi
            if [ -s failed.txt ]; then
              echo
              echo "Scan failed:"
              sed 's/.*/- `&`/' failed.txt
            fi
          } > body.md
          gh label create vulnerabilities --color B60205 --description "Trivy dashboard" --force
          issue=$(gh issue list --label vulnerabilities --author app/github-actions --state all --limit 1 --json number,state --jq '.[0] // empty | "\(.number) \(.state)"')
          read -r number state <<< "$issue"
          if [ -s findings.jsonl ] || [ -s failed.txt ]; then
            if [ -z "$number" ]; then
              gh issue create --title "Vulnerability Dashboard" --label vulnerabilities --body-file body.md
            else
              gh issue edit "$number" --body-file body.md
              [ "$state" = OPEN ] || gh issue reopen "$number"
            fi
          elif [ "$state" = OPEN ]; then
            gh issue edit "$number" --body-file body.md
            gh issue close "$number" --comment "No CRITICAL CVEs with a fix."
          fi
