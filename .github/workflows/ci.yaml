name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    env:
      KUBERNETES_VERSION: 1.36.2
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Render Helm charts of all Applications
        run: |
          local_version=$(yq -r .version charts/app/Chart.yaml)
          for app in infra/argocd/applications/*.yaml; do
            yq -r '. as $a | (.spec.sources // [.spec.source])[] | select(has("helm")) | [$a.metadata.name, .helm.releaseName // $a.metadata.name, $a.spec.destination.namespace, .chart, .repoURL, .targetRevision, ((.helm.valueFiles // []) | map(sub("^\\$values/"; "")) | join(" -f ") | select(. != "") // "-")] | @tsv' "$app"
          done | grep . | while IFS=$'\t' read -r name release ns chart repo rev values; do
            args=(--kube-version "$KUBERNETES_VERSION" -n "$ns")
            [ "$values" != "-" ] && args+=(-f $values)
            if [[ "$repo" == *://* ]]; then
              helm template "$release" "$chart" --repo "$repo" --version "$rev" "${args[@]}"
            elif ! helm template "$release" "oci://$repo/$chart" --version "$rev" "${args[@]}"; then
              [ "$repo/$chart" = "ghcr.io/mescoczubinski/charts/app" ] && [ "$rev" = "$local_version" ] || exit 1
              echo "::warning::app $rev is not on GHCR yet, $name rendered from charts/app" >&2
              helm template "$release" charts/app "${args[@]}"
            fi
          done > rendered.yaml
      - name: Render charts/app with the values of every app
        run: |
          for values in apps/*/values.yaml; do
            app=$(basename "$(dirname "$values")")
            helm lint charts/app -n "$app" -f "$values" >&2
            helm template "$app" charts/app --kube-version "$KUBERNETES_VERSION" -n "$app" -f "$values"
          done >> rendered.yaml
      - name: Validate rendered charts
        run: kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -skip SealedSecret < rendered.yaml
      - name: Validate plain manifests
        run: kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -skip SealedSecret -ignore-filename-pattern 'values.yaml' -ignore-filename-pattern 'k0sctl.yaml' tools infra
