name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    env:
      KUBERNETES_VERSION: 1.36.2
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Render Helm charts of all Applications
        run: |
          for app in infra/argocd/applications/*.yaml; do
            yq -r '. as $a | (.spec.sources // [.spec.source])[] | select(has("helm")) | [$a.metadata.name, .helm.releaseName // $a.metadata.name, $a.spec.destination.namespace, .chart // "-", .repoURL, .targetRevision, .path // "-", ((.helm.valueFiles // []) | map(sub("^\\$values/"; "")) | join(" -f ") | select(. != "") // "-")] | @tsv' "$app"
          done | grep . | while IFS=$'\t' read -r name release ns chart repo rev path values; do
            args=(--kube-version "$KUBERNETES_VERSION" -n "$ns")
            [ "$values" != "-" ] && args+=(-f $values)
            if [ "$chart" != "-" ]; then
              helm template "$release" "$chart" --repo "$repo" --version "$rev" "${args[@]}"
            else
              helm lint "$path" "${args[@]:2}" >&2
              helm template "$release" "$path" "${args[@]}"
            fi
          done > rendered.yaml
      - name: Validate rendered charts
        run: kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -skip SealedSecret < rendered.yaml
      - name: Validate plain manifests
        run: kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version "$KUBERNETES_VERSION" -skip SealedSecret -ignore-filename-pattern 'values.yaml' -ignore-filename-pattern 'k0sctl.yaml' tools infra
