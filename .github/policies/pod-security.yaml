apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: run-as-non-root
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?securityContext.?runAsNonRoot.orValue(object.spec.?securityContext.?runAsNonRoot.orValue(false)) &&
          c.?securityContext.?runAsUser.orValue(object.spec.?securityContext.?runAsUser.orValue(-1)) != 0)
      message: runAsNonRoot must be true and runAsUser must not be 0
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-privilege-escalation
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: allowPrivilegeEscalation must be false
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: drop-all-capabilities
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.containers.all(c, 'ALL' in c.?securityContext.?capabilities.?drop.orValue([]))
      message: capabilities.drop must contain ALL
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-added-capabilities
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.containers.all(c, c.?securityContext.?capabilities.?add.orValue([]).size() == 0)
      message: capabilities.add must be empty
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: seccomp-runtime-default
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?securityContext.?seccompProfile.?type.orValue(object.spec.?securityContext.?seccompProfile.?type.orValue('')) == 'RuntimeDefault')
      message: seccompProfile.type must be RuntimeDefault
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: read-only-root-filesystem
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false))
      message: readOnlyRootFilesystem must be true, with emptyDir for writable paths
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-privileged
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))
      message: privileged must not be true
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-host-namespaces
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) &&
        !object.spec.?hostPID.orValue(false) &&
        !object.spec.?hostIPC.orValue(false)
      message: hostNetwork, hostPID and hostIPC must not be true
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-host-ports
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.containers.all(c, c.?ports.orValue([]).all(p, p.?hostPort.orValue(0) == 0))
      message: hostPort must not be set
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: host-path-under-home-server
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: object.spec.?volumes.orValue([]).all(v, !has(v.hostPath) || v.hostPath.path.startsWith('/home/server/'))
      message: hostPath must be under /home/server/
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pinned-image
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    # Tag after the last "/", so a registry port (host:5000/image) isn't a tag.
    - expression: >-
        variables.containers.all(c, c.image.contains('@sha256:') ||
          (c.image.split('/')[c.image.split('/').size() - 1].contains(':') && !c.image.endsWith(':latest')))
      message: image must be pinned to a tag other than latest, or a digest
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: no-default-service-account-token
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.?serviceAccountName.orValue('default') != 'default' ||
        !object.spec.?automountServiceAccountToken.orValue(true)
      message: pods on the default ServiceAccount must set automountServiceAccountToken to false
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  # API VIP static pod: host network, root with NET_ADMIN/NET_RAW, admin kubeconfig.
  policyRefs:
    - name: run-as-non-root
      kind: ValidatingPolicy
    - name: no-added-capabilities
      kind: ValidatingPolicy
    - name: no-host-namespaces
      kind: ValidatingPolicy
    - name: host-path-under-home-server
      kind: ValidatingPolicy
    - name: no-default-service-account-token
      kind: ValidatingPolicy
  matchConditions:
    - name: kube-vip
      expression: object.metadata.namespace == 'kube-system' && object.metadata.name == 'kube-vip'
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: traefik
  namespace: traefik
spec:
  # hostPorts for 80/443 and the TCP entrypoints.
  policyRefs:
    - name: no-host-ports
      kind: ValidatingPolicy
  matchConditions:
    - name: traefik
      expression: object.metadata.namespace == 'traefik' && object.metadata.name == 'traefik'
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: beszel-agent
  namespace: beszel
spec:
  # Host metrics: hostNetwork, hostPID, read-only /proc and /sys.
  policyRefs:
    - name: no-host-namespaces
      kind: ValidatingPolicy
    - name: host-path-under-home-server
      kind: ValidatingPolicy
  matchConditions:
    - name: beszel-agent
      expression: object.metadata.namespace == 'beszel' && object.metadata.name == 'beszel-agent'
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: samba
  namespace: samba
spec:
  # smbd runs as root, switches to the share users, writes state into the image.
  policyRefs:
    - name: run-as-non-root
      kind: ValidatingPolicy
    - name: no-added-capabilities
      kind: ValidatingPolicy
    - name: read-only-root-filesystem
      kind: ValidatingPolicy
  matchConditions:
    - name: samba
      expression: object.metadata.namespace == 'samba' && object.metadata.name == 'samba'
